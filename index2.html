<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suspención aleatoria</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --ink: #111;
      --accent: #e8305a;
      --margin: 4vw;
      --topbar-h: 48px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── TOP BAR ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--margin);
      z-index: 100;
      background: var(--bg);
    }

/* ── CONFIGURACIÓN DEL CONTENEDOR PRINCIPAL (TOPBAR-LEFT) ── */
	#topbar-left {
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--ink);
      position: relative;
      display: inline-flex;  /* Cambiado a inline-flex para ceñirse exactamente al texto */
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }

    /* Contenedor del menú desplegable */
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;               /* Se alinea exactamente con el borde izquierdo del texto */
      background-color: var(--bg);
      min-width: 240px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.06);
      border: 1px solid #eee;
      z-index: 1000;
      padding: 6px 0;
      margin-top: 0;         /* Pegado al texto para evitar zonas muertas donde se cierra */
    }

    /* Enlaces internos del menú */
    .dropdown-content a {
      color: var(--ink);
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      font-size: 13px;
      letter-spacing: 0.03em;
      text-align: left;
      transition: background 0.15s ease;
      opacity: 1;          /* Mantiene la estética sutil original */
    }

    /* Comportamiento al pasar el cursor sobre las opciones */
    .dropdown-content a:hover {
      background-color: #f5f5f5;
      color: var(--accent);
      opacity: 1;
    }

    /* Muestra el menú cuando el mouse se posiciona sobre cualquier parte de #topbar-left */
	#topbar-left:hover {
      opacity: 0.9;
    }
	
	.dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;               
      background-color: var(--bg);
      width: 240px;          /* Cambiado de min-width a width fijo */
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.06);
      border: 1px solid #eee;
      z-index: 1000;
      padding: 6px 0;
      margin-top: -2px;      /* Sube ligeramente para eliminar cualquier milímetro de aire */
      pointer-events: auto;  /* Asegura interacción interna autónoma */
    }
	
    /* Pequeño indicador de flecha discreto */
    .dropdown-trigger::after {
      content: ' ▾';
      font-size: 10px;
      opacity: 1;
      vertical-align: middle;
    }
	
	.dropdown-trigger:hover + .dropdown-content,
    .dropdown-content:hover {
      display: block;
    }

    #topbar-nav {
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: flex-end;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--ink);
      cursor: pointer;
      padding: 0;
      opacity: 0.4;
      transition: opacity 0.15s;
    }
    .nav-btn:hover { opacity: 0.8; }
    .nav-btn.active { opacity: 1; color: var(--accent); }

    .sep { font-size: 12px; opacity: 0.2; pointer-events: none; }

    /* ── CANVAS ── */
    #canvas {
      position: fixed;
      top: var(--topbar-h);
      left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }

    /* ── EMPTY STATE ── */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: var(--margin);
      transition: opacity 0.3s;
    }
    #empty-state.visible {
      display: flex;
      opacity: 1;
      pointer-events: all;
    }
    #empty-state p {
      font-size: 13px;
      color: var(--ink);
      opacity: 0.4;
      line-height: 1.6;
      max-width: 320px;
    }
    #empty-upload-btn {
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: none;
      border: 1px solid rgba(0,0,0,0.15);
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: border-color 0.15s, opacity 0.15s;
      opacity: 0.6;
    }
    #empty-upload-btn:hover { opacity: 1; border-color: rgba(0,0,0,0.4); }

    /* ── STAGE ──
       Always two slots side by side.
       Left slot holds one image, right slot holds the other.
       Each slot has its own aspect-ratio set dynamically by JS.
    ── */
    #stage {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 4px;
    }

    .slot {
      overflow: hidden;
      position: relative;
      flex: none;
      min-width: 0; min-height: 0;
      background: #ebebeb;
    }

    .slot img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
      transition: opacity 0.4s ease;
    }
    .slot img.fading { opacity: 0; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
      z-index: 400;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0;
      z-index: 300;
      background: rgba(255,255,255,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
      cursor: zoom-out;
    }
    #lightbox.open { opacity: 1; pointer-events: all; }
    #lightbox img {
      max-width: 90vw; max-height: 90vh;
      object-fit: contain; display: block; cursor: default;
      transform: scale(0.98); opacity: 0;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
    }
    #lightbox.open img { transform: scale(1); opacity: 1; }

    /* ── TEXT MODAL ── */
    #textmodal {
      position: fixed; inset: 0;
      z-index: 300;
      background: rgba(255,255,255,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
      cursor: zoom-out;
    }
    #textmodal.open { opacity: 1; pointer-events: all; }
    #textmodal-content {
      font-size: clamp(14px, 2vw, 20px);
      color: var(--ink);
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
      letter-spacing: 0.01em;
      opacity: 0.75;
      padding: 0 var(--margin);
    }

    #upload-count {
      font-size: 11px;
      opacity: 0.35;
      margin-left: 2px;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="topbar-left">
      <span class="dropdown-trigger">Suspención Aleatoria Mix</span>
      <div class="dropdown-content">
        <a href="index.html">Suspención Aleatoria H-V</a>
        <a href="index2.html">Suspención Aleatoria Mix</a>
        <a href="index3.html">Suspención Aleatoria Auto</a>
		<a href="index4.html">Suspención Aleatoria Multi</a>
      </div>
    </div>
    <div></div>
    <nav id="topbar-nav">
      <button class="nav-btn" id="btn-texto">Texto</button>
      <span class="sep">/</span>
      <button class="nav-btn" id="btn-upload">↑<span id="upload-count"></span></button>
      <span class="sep">/</span>
      <button class="nav-btn" id="btn-download">↓</button>
    </nav>
  </div>

  <input type="file" id="file-input" accept="image/*" multiple style="display:none" />

  <div id="canvas">
    <div id="empty-state" class="visible">
      <p>Sube tus imágenes para comenzar.<br>Se ordenarán automáticamente en vertical y horizontal.</p>
      <button id="empty-upload-btn">Subir imágenes</button>
    </div>

    <div id="stage" style="display:none">
      <div class="slot" id="slot-a"><img id="img-a" src="" alt="" /></div>
      <div class="slot" id="slot-b"><img id="img-b" src="" alt="" /></div>
    </div>
  </div>

  <div id="lightbox"><img id="lightbox-img" src="" alt="" /></div>
  <div id="textmodal">
    <p id="textmodal-content">
      Que el azar defina la relación entre las imágenes.<br>
      <span style="opacity:0.6; font-size:0.9em;">Proyecto por rcavieresq</span>
    </p>
  </div>
  <div id="toast"></div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // IMAGE POOLS
    // verticalImages   → portrait  (taller than wide)
    // horizontalImages → landscape (wider than tall)
    // ─────────────────────────────────────────────────────────────
    let verticalImages   = [];
    let horizontalImages = [];

    // Natural dimensions of each image, keyed by object URL
    // so we can use the real ratio when sizing slots
    const imageDims = {};

    // ─────────────────────────────────────────────────────────────
    // DOM
    // ─────────────────────────────────────────────────────────────
    const stage      = document.getElementById('stage');
    const slotA      = document.getElementById('slot-a');
    const slotB      = document.getElementById('slot-b');
    const imgA       = document.getElementById('img-a');
    const imgB       = document.getElementById('img-b');
    const canvas     = document.getElementById('canvas');
    const lb         = document.getElementById('lightbox');
    const lbImg      = document.getElementById('lightbox-img');
    const btnT       = document.getElementById('btn-texto');
    const btnD       = document.getElementById('btn-download');
    const btnUpload  = document.getElementById('btn-upload');
    const fileInput  = document.getElementById('file-input');
    const emptyState = document.getElementById('empty-state');
    const emptyBtn   = document.getElementById('empty-upload-btn');
    const tm         = document.getElementById('textmodal');
    const toast      = document.getElementById('toast');
    const uploadCount = document.getElementById('upload-count');

    let busy         = false;
    let lightboxOpen = false;
    let textOpen     = false;

    // Current pair — stored so download knows real dimensions
    let currentA = null; // { url, w, h }
    let currentB = null;

    // ─────────────────────────────────────────────────────────────
    // TOAST
    // ─────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ─────────────────────────────────────────────────────────────
    // UPLOAD
    // ─────────────────────────────────────────────────────────────
    function handleFiles(files) {
      if (!files || files.length === 0) return;
      let loaded = 0, addedV = 0, addedH = 0;
      const total = files.length;

      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) { if (++loaded === total) onAllLoaded(addedV, addedH); return; }

        const url   = URL.createObjectURL(file);
        const probe = new Image();
        probe.onload = () => {
          const w = probe.naturalWidth, h = probe.naturalHeight;
          imageDims[url] = { w, h };
          if (w >= h) { if (!horizontalImages.includes(url)) { horizontalImages.push(url); addedH++; } }
          else        { if (!verticalImages.includes(url))   { verticalImages.push(url);   addedV++; } }
          if (++loaded === total) onAllLoaded(addedV, addedH);
        };
        probe.onerror = () => { if (++loaded === total) onAllLoaded(addedV, addedH); };
        probe.src = url;
      });
    }

    function onAllLoaded(addedV, addedH) {
      updateUploadCount();
      const hasV = verticalImages.length > 0;
      const hasH = horizontalImages.length > 0;

      if (hasV || hasH) {
        emptyState.classList.remove('visible');
        stage.style.display = 'flex';
        showPair(true);
        setTimeout(resizeStage, 0);
      }

      const parts = [];
      if (addedV > 0) parts.push(`${addedV} vertical${addedV > 1 ? 'es' : ''}`);
      if (addedH > 0) parts.push(`${addedH} horizontal${addedH > 1 ? 'es' : ''}`);
      showToast(parts.length > 0
        ? `+${parts.join(', ')} añadida${addedV + addedH > 1 ? 's' : ''}`
        : 'No se añadieron imágenes nuevas');

      fileInput.value = '';
    }

    function updateUploadCount() {
      const t = verticalImages.length + horizontalImages.length;
      uploadCount.textContent = t > 0 ? ` (${t})` : '';
    }

    btnUpload.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
    emptyBtn.addEventListener('click',  e => { e.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

    // ─────────────────────────────────────────────────────────────
    // PICK — always one portrait + one landscape, random order
    // ─────────────────────────────────────────────────────────────
    function pickRandom(arr, exclude = []) {
      const pool = arr.filter(x => !exclude.includes(x));
      const src  = pool.length ? pool : arr;
      return src[Math.floor(Math.random() * src.length)];
    }

    function pickPair() {
      const hasV = verticalImages.length > 0;
      const hasH = horizontalImages.length > 0;

      let urlA, urlB, typeA, typeB;

      if (hasV && hasH) {
        // One of each, random order
        const ver = pickRandom(verticalImages);
        const hor = pickRandom(horizontalImages);
        if (Math.random() < 0.5) {
          urlA = ver; typeA = 'v';
          urlB = hor; typeB = 'h';
        } else {
          urlA = hor; typeA = 'h';
          urlB = ver; typeB = 'v';
        }
      } else if (hasV) {
        // Only portraits — pick two different ones
        urlA = pickRandom(verticalImages);
        urlB = pickRandom(verticalImages, [urlA]);
        typeA = typeB = 'v';
      } else {
        // Only landscapes — pick two different ones
        urlA = pickRandom(horizontalImages);
        urlB = pickRandom(horizontalImages, [urlA]);
        typeA = typeB = 'h';
      }

      return [
        { url: urlA, ...imageDims[urlA], type: typeA },
        { url: urlB, ...imageDims[urlB], type: typeB },
      ];
    }

    // ─────────────────────────────────────────────────────────────
    // SHOW PAIR
    // ─────────────────────────────────────────────────────────────
    function showPair(instant = false) {
      if (busy && !instant) return;
      if (verticalImages.length === 0 && horizontalImages.length === 0) return;

      const [a, b] = pickPair();
      currentA = a;
      currentB = b;

      if (instant) {
        imgA.src = a.url;
        imgB.src = b.url;
        applySizes(a, b);
        return;
      }

      busy = true;
      imgA.classList.add('fading');
      imgB.classList.add('fading');

      setTimeout(() => {
        imgA.src = a.url;
        imgB.src = b.url;
        applySizes(a, b);
        let done = 0;
        const check = () => {
          if (++done >= 2) { imgA.classList.remove('fading'); imgB.classList.remove('fading'); busy = false; }
        };
        imgA.onload = check; imgB.onload = check;
        setTimeout(() => { busy = false; imgA.classList.remove('fading'); imgB.classList.remove('fading'); }, 900);
      }, 380);
    }

    // ─────────────────────────────────────────────────────────────
    // APPLY SIZES — set each slot width/height from real image ratio
    // ─────────────────────────────────────────────────────────────
    function applySizes(a, b) {
      if (!a || !b) return;
      const topbarH = 48;
      const margin  = window.innerWidth * 0.05;
      const maxW    = window.innerWidth  - margin * 2;
      const maxH    = window.innerHeight - topbarH - margin * 2;
      const gap     = 4;

      const ratioA = a.w / a.h;
      const ratioB = b.w / b.h;

      // Both slots share the same height H.
      // Total width = H*ratioA + gap + H*ratioB = H*(ratioA+ratioB) + gap
      // Solve for H given maxW, then clamp to maxH.
      let H = (maxW - gap) / (ratioA + ratioB);
      if (H > maxH) H = maxH;
      const W = H * (ratioA + ratioB) + gap;

      stage.style.width  = W + 'px';
      stage.style.height = H + 'px';

      slotA.style.width  = (H * ratioA) + 'px';
      slotA.style.height = H + 'px';
      slotB.style.width  = (H * ratioB) + 'px';
      slotB.style.height = H + 'px';
    }

    function resizeStage() {
      if (stage.style.display === 'none') return;
      if (currentA && currentB) applySizes(currentA, currentB);
    }

    window.addEventListener('resize', resizeStage);

    // ─────────────────────────────────────────────────────────────
    // CANVAS CLICK
    // ─────────────────────────────────────────────────────────────
    canvas.addEventListener('click', e => {
      if (lightboxOpen || textOpen) return;
      if (e.target.tagName === 'IMG' && e.target !== lbImg) { openLB(e.target.src); return; }
      showPair();
    });

    // ─────────────────────────────────────────────────────────────
    // LIGHTBOX
    // ─────────────────────────────────────────────────────────────
    function openLB(src) { lightboxOpen = true; lbImg.src = src; lb.classList.add('open'); }
    function closeLB()   { lb.classList.remove('open'); setTimeout(() => { lightboxOpen = false; }, 280); }
    lb.addEventListener('click', e => { if (e.target === lb) closeLB(); });

    // ─────────────────────────────────────────────────────────────
    // TEXT MODAL
    // ─────────────────────────────────────────────────────────────
    function openText()  { textOpen = true;  btnT.classList.add('active');    tm.classList.add('open'); }
    function closeText() { textOpen = false; btnT.classList.remove('active'); tm.classList.remove('open'); }
    btnT.addEventListener('click', e => { e.stopPropagation(); textOpen ? closeText() : openText(); });
    tm.addEventListener('click', e => { if (e.target === tm) closeText(); });

    // ─────────────────────────────────────────────────────────────
    // KEYBOARD
    // ─────────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (lightboxOpen) { closeLB(); return; } if (textOpen) { closeText(); return; } }
      if (!lightboxOpen && !textOpen && (e.key === ' ' || e.key === 'ArrowRight')) showPair();
    });

    // ─────────────────────────────────────────────────────────────
    // DOWNLOAD
    // ─────────────────────────────────────────────────────────────
    btnD.addEventListener('click', e => {
      e.stopPropagation();
      if (!currentA || !currentB) return;
      downloadPair();
    });

    function downloadPair() {
      const border = 60;
      const gap    = 8;
      const scale  = 2; // 2× for retina output

      // Use actual image dimensions scaled so height = 1080px equivalent
      const targetH = 1080;
      const wA = Math.round(targetH * currentA.w / currentA.h);
      const wB = Math.round(targetH * currentB.w / currentB.h);

      const totalW = (wA + gap + wB + border * 2) * scale;
      const totalH = (targetH + border * 2) * scale;

      const off = document.createElement('canvas');
      off.width = totalW; off.height = totalH;
      const ctx = off.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, totalW, totalH);

      const loadImg = src => new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
      });

      btnD.textContent = '…';

      Promise.all([loadImg(currentA.url), loadImg(currentB.url)])
        .then(([ia, ib]) => {
          const s = scale;
          ctx.drawImage(ia, border*s,         border*s, wA*s, targetH*s);
          ctx.drawImage(ib, (border+wA+gap)*s, border*s, wB*s, targetH*s);
          off.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a   = document.createElement('a');
            a.href = url; a.download = 'random-' + Date.now() + '.png';
            a.click(); URL.revokeObjectURL(url);
            btnD.textContent = '↓';
          }, 'image/png');
        })
        .catch(() => { btnD.textContent = '↓'; showToast('Error al generar la imagen'); });
    }
  </script>
</body>
</html>
